name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Default permissions are read-only, jobs override as needed
permissions:
  contents: read

jobs:
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read  # Required to checkout code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify-npm-package:
    name: Verify npm Package Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Verify .npmignore exists
        run: |
          echo "Verifying .npmignore files exist..."
          for package in packages/*/package.json; do
            pkg_dir=$(dirname "$package")
            pkg_name=$(basename "$pkg_dir")

            if [ ! -f "$pkg_dir/.npmignore" ]; then
              echo "ERROR: Missing .npmignore in $pkg_dir"
              exit 1
            fi

            echo "✓ $pkg_name has .npmignore"
          done

      - name: Verify npm pack excludes dev files
        run: |
          echo "Verifying npm pack output excludes development files..."
          for package in packages/*/package.json; do
            pkg_dir=$(dirname "$package")
            pkg_name=$(basename "$pkg_dir")
            dist_dir="dist/$pkg_dir"

            echo "Checking $pkg_name..."
            cd "$dist_dir"

            # Get list of files that would be published
            FILES=$(npm pack --dry-run 2>&1 | grep "npm notice" | grep -E "^\s*npm notice [0-9]" | awk '{print $3}')

            # Check for files that should NOT be published
            FORBIDDEN_FILES=(
              "project.json"
              "tsconfig.json"
              "tsconfig.lib.json"
              "CHANGELOG.md"
              ".vscode"
              ".idea"
              ".claude"
              ".env"
            )

            for forbidden in "${FORBIDDEN_FILES[@]}"; do
              if echo "$FILES" | grep -q "$forbidden"; then
                echo "ERROR: Forbidden file '$forbidden' found in npm pack output for $pkg_name"
                exit 1
              fi
            done

            # Check for TypeScript source files (should only have .d.ts, not .ts)
            if echo "$FILES" | grep -E "\.ts$" | grep -v "\.d\.ts$"; then
              echo "ERROR: TypeScript source files (.ts) found in npm pack output for $pkg_name"
              exit 1
            fi

            echo "✓ $pkg_name npm pack output is clean"
            cd - > /dev/null
          done

      - name: Verify CODEOWNERS protections
        run: |
          echo "Verifying CODEOWNERS protections..."

          if [ ! -f .github/CODEOWNERS ]; then
            echo "ERROR: .github/CODEOWNERS file not found"
            exit 1
          fi

          # Check for required protections
          REQUIRED_PROTECTIONS=(
            "\.npmignore"
            "\.github/workflows/"
            "\.github/actions/"
            "nx\.json"
          )

          for protection in "${REQUIRED_PROTECTIONS[@]}"; do
            if ! grep -q "$protection" .github/CODEOWNERS; then
              echo "ERROR: Missing CODEOWNERS protection for: $protection"
              exit 1
            fi
            echo "✓ CODEOWNERS protects: $protection"
          done

          echo "✓ All required CODEOWNERS protections in place"

      - name: Detect obfuscated code
        run: |
          chmod +x .github/scripts/detect-obfuscated-code.sh
          .github/scripts/detect-obfuscated-code.sh

      - name: Create verification summary
        if: success()
        run: |
          echo "## Package Security Verification ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verified" >> $GITHUB_STEP_SUMMARY
          echo "- .npmignore files exist for all packages" >> $GITHUB_STEP_SUMMARY
          echo "- npm pack excludes development files" >> $GITHUB_STEP_SUMMARY
          echo "- npm pack excludes TypeScript source files" >> $GITHUB_STEP_SUMMARY
          echo "- CODEOWNERS protects critical infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "- No obfuscated code patterns detected" >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Verify build output
        run: |
          echo "Verifying playwright-test-auth package build..."
          test -f dist/packages/playwright-test-auth/src/index.js || exit 1
          test -f dist/packages/playwright-test-auth/src/auth.js || exit 1
          test -f dist/packages/playwright-test-auth/src/global-setup.js || exit 1
          test -f dist/packages/playwright-test-auth/package.json || exit 1
          echo "✅ Build verification passed"

      - name: Create summary
        if: success()
        run: |
          echo "## Build Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Node.js version: 20" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Packages" >> $GITHUB_STEP_SUMMARY
          echo "- playwright-test-auth" >> $GITHUB_STEP_SUMMARY

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, verify-npm-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write  # Required to push commits/tags and create GitHub releases
      id-token: write  # Required for npm provenance (OIDC-based trusted publishing)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for nx release to access git history
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run release process
        uses: ./.github/actions/release
